services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - SWAPI_BASE_URL=https://www.swapi.tech/api
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

